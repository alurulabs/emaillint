<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MSO properties test</title>
  <style>
    table { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  </style>
</head>
<body>
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
    <tr>
      <td style="padding:24px;mso-line-height-rule:exactly;line-height:24px;font-family:Arial,sans-serif;">
        <h1>Outlook-tuned text</h1>
        <p>Uses mso-prefixed properties for Outlook rendering fidelity.</p>
        <p style="mso-ansi-font-size:16px;font-size:16px;">Ansi font size pinned.</p>
      </td>
    </tr>
  </table>
</body>
</html>
