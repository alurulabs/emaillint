<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dark mode test</title>
  <style>
    body { background: #ffffff; color: #222222; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #eeeeee; }
      .card { background: #2a2a2a; }
    }
  </style>
</head>
<body>
  <table role="presentation" width="600" cellpadding="0" cellspacing="0">
    <tr><td class="card" style="padding:24px;font-family:Arial,sans-serif;">
      <h1>Adaptive email</h1>
      <p>Background swaps in dark mode clients.</p>
    </td></tr>
  </table>
</body>
</html>
