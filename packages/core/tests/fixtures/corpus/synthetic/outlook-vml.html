<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Outlook VML test</title>
  <!--[if mso]>
  <style type="text/css">
    .body-outlook { font-family: Arial, sans-serif; }
  </style>
  <![endif]-->
</head>
<body class="body-outlook">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0">
    <tr>
      <td style="padding:24px;">
        <!--[if mso]>
        <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;">
          <v:fill type="solid" color="#1a73e8" />
          <v:textbox inset="0,0,0,0">
        <![endif]-->
        <div style="background:#1a73e8;color:#ffffff;padding:24px;font-family:Arial,sans-serif;">
          <h1>Banner with background</h1>
          <p>Uses a VML fallback for Outlook backgrounds.</p>
        </div>
        <!--[if mso]>
          </v:textbox>
        </v:rect>
        <![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
