<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Newsletter</title>
  <style>
    .hero { font-family: Arial, sans-serif; }
  </style>
</head>
<body>
  <table role="presentation" width="600" cellpadding="0" cellspacing="0">
    <tr>
      <td class="hero">
        <img src="https://example.com/banner.png" alt="Weekly Newsletter banner">
      </td>
    </tr>
    <tr>
      <td>
        <h1>Hello reader</h1>
        <p>Here is this week's update.</p>
      </td>
    </tr>
    <tr>
      <td>
        <a href="https://example.com/read-more">Read more</a>
      </td>
    </tr>
    <tr>
      <td>
        <table role="presentation" width="100%">
          <tr>
            <td><img src="https://example.com/icon1.png" alt="Feature one"></td>
            <td><img src="https://example.com/icon2.png" alt="Feature two"></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
