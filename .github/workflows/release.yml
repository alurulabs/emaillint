name: release

# Two triggers:
#  - push tag vX.Y.Z: asserts the tag matches core/cli versions and the
#    CHANGELOG, publishes core + cli (and any unpublished adapter) to npm via
#    Trusted Publishing (OIDC, tokenless) with provenance, and cuts the GitHub
#    Release from the CHANGELOG.
#  - workflow_dispatch: "publish whatever is unpublished". Ships the framework
#    adapters (@emaillint/mjml, @emaillint/react-email), which version
#    independently of core/cli. Skips the version-check and Release steps.
# Each package needs its npm Trusted Publisher config (repo=alurulabs/emaillint,
# workflow=release.yml).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release from the tag
  id-token: write   # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm to 11 (Trusted Publishing needs >=11.5.1; npm@latest is now 12, which needs Node 22+)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Verify version + CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CORE=$(jq -r .version packages/core/package.json)
          CLI=$(jq -r .version packages/cli/package.json)
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$CORE" != "$TAG" ] || [ "$CLI" != "$TAG" ] || [ "$CORE" != "$CLI" ]; then
            echo "::error::version mismatch: core=$CORE cli=$CLI tag=$TAG"
            exit 1
          fi
          if ! grep -q "## \[$CORE\]" CHANGELOG.md; then
            echo "::error::CHANGELOG missing entry for [$CORE]; add it before tagging"
            exit 1
          fi
          echo "versions ok: core=cli=$CORE (tag $TAG), CHANGELOG present"
      - name: Publish emaillint-core (skip if already published)
        run: |
          VER=$(jq -r .version packages/core/package.json)
          if npm view emaillint-core@"$VER" version >/dev/null 2>&1; then
            echo "emaillint-core@$VER already published - skipping"
          else
            npm publish --provenance --access public --workspace emaillint-core
          fi
      - name: Publish @emaillint/cli (skip if already published)
        run: |
          VER=$(jq -r .version packages/cli/package.json)
          if npm view @emaillint/cli@"$VER" version >/dev/null 2>&1; then
            echo "@emaillint/cli@$VER already published - skipping"
          else
            npm publish --provenance --access public --workspace @emaillint/cli
          fi
      - name: Publish @emaillint/mjml (skip if already published)
        run: |
          VER=$(jq -r .version packages/mjml/package.json)
          if npm view @emaillint/mjml@"$VER" version >/dev/null 2>&1; then
            echo "@emaillint/mjml@$VER already published - skipping"
          else
            npm publish --provenance --access public --workspace @emaillint/mjml
          fi
      - name: Publish @emaillint/react-email (skip if already published)
        run: |
          VER=$(jq -r .version packages/react-email/package.json)
          if npm view @emaillint/react-email@"$VER" version >/dev/null 2>&1; then
            echo "@emaillint/react-email@$VER already published - skipping"
          else
            npm publish --provenance --access public --workspace @emaillint/react-email
          fi
      - name: GitHub Release (create or update)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VER=${TAG#v}
          NOTES=$(awk -v ver="## [$VER]" 'index($0,ver)==1{found=1; next} /^## \[/{found=0} found{print}' CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - updating notes"
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
